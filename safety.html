<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>職業安全管理甲級 學科測驗</title>
<style>
  :root{
    --blue:#1565c0; --blue-d:#0d47a1; --green:#2e7d32; --red:#c62828;
    --grey:#757575; --bg:#f4f5f7; --card:#ffffff; --border:#e0e0e0; --text:#222;
    --orange:#ef6c00;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Microsoft JhengHei","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
  }
  #app{max-width:900px; margin:0 auto; padding:16px;}
  h1,h2,h3{margin:0 0 12px;}
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--blue); color:#fff; padding:12px 16px; margin-bottom:16px; border-radius:8px;
    flex-wrap:wrap; gap:8px;
  }
  .topbar a, .topbar button{color:#fff;}
  .topbar-title{font-weight:bold; font-size:18px;}
  .topbar-actions{display:flex; gap:8px; flex-wrap:wrap;}
  button, .btn{
    cursor:pointer; border:none; border-radius:6px; padding:8px 14px; font-size:14px;
    background:var(--blue); color:#fff; transition:opacity .15s;
  }
  button:hover, .btn:hover{opacity:.85;}
  button:disabled{background:#bbb; cursor:not-allowed;}
  button.secondary{background:#fff; color:var(--blue); border:1px solid var(--blue);}
  button.grey{background:var(--grey);}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:18px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .grid-home{display:grid; grid-template-columns:repeat(2,1fr); gap:16px;}
  @media (max-width:600px){ .grid-home{grid-template-columns:1fr;} }
  .home-card{text-align:center;}
  .home-card h2{font-size:20px;}
  .home-card .desc{color:var(--grey); font-size:13px; margin-bottom:12px; min-height:36px;}
  .scope-options{display:flex; gap:12px; justify-content:center; margin-bottom:12px; flex-wrap:wrap; font-size:14px;}
  .mode-btn-group{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .mode-btn-group button{flex:1 1 140px; min-height:44px; line-height:1.3;}
  .mode-btn-sub{display:block; font-size:11px; opacity:.85; font-weight:normal;}
  .badge{display:inline-block; background:var(--orange); color:#fff; font-size:12px; padding:2px 8px; border-radius:10px; margin-left:6px;}
  .badge-count{display:inline-block; background:var(--red); color:#fff; font-size:12px; padding:1px 8px; border-radius:10px;}
  .progress{font-size:14px; color:#eee;}
  .stem{font-size:17px; margin-bottom:16px; white-space:pre-wrap;}
  .option-row{
    display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--border);
    border-radius:8px; margin-bottom:8px; cursor:pointer;
  }
  .option-row:hover{background:#f9f9f9;}
  .option-row input{margin-top:3px;}
  .option-row.selected-flash{background:#e3f2fd; border-color:var(--blue);}
  .progress-bar-track{height:8px; background:#e0e0e0; border-radius:4px; margin-bottom:6px; overflow:hidden;}
  .progress-bar-fill{height:100%; background:var(--blue); transition:width .2s;}
  .exam-footer{display:flex; justify-content:flex-end; margin-top:16px; gap:8px; flex-wrap:wrap;}
  .confirm-bar{display:flex; justify-content:flex-end; align-items:center; margin-top:16px; gap:10px; flex-wrap:wrap;}
  .exam-sticky-head{background:var(--bg);}
  .marathon-feedback{margin-top:14px;}
  .opt-correct-selected{background:#e8f5e9; border-color:var(--green) !important;}
  .opt-correct-missed{background:#fff8e1; border-color:var(--orange) !important;}
  .opt-wrong-selected{background:#ffebee; border-color:var(--red) !important;}
  .tag-ok{color:var(--green); font-weight:bold;}
  .tag-ng{color:var(--red); font-weight:bold;}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th,td{border:1px solid var(--border); padding:8px; text-align:center;}
  th{background:#f0f0f0;}
  .bar-row{display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:14px;}
  .bar-label{width:170px; flex-shrink:0; text-align:right; font-size:13px;}
  .bar-track{flex:1; background:#eee; border-radius:4px; overflow:hidden; height:18px;}
  .bar-fill{height:100%; background:var(--blue);}
  .empty-msg{color:var(--grey); text-align:center; padding:24px;}
  .result-summary{text-align:center; padding:12px 0;}
  .result-summary .score{font-size:42px; font-weight:bold; color:var(--blue);}
  .qresult{border-bottom:1px solid var(--border); padding:14px 0;}
  .qresult:last-child{border-bottom:none;}
  input[type=file]{display:none;}
  .small{font-size:12px; color:var(--grey);}
  .q-img{display:block; max-width:100%; margin:8px auto 16px; border:1px solid var(--border); border-radius:6px;}
  .wb-card{position:relative;}
  .wb-corner{position:absolute; top:18px; right:18px; font-size:12px; color:var(--grey); background:var(--bg); padding:2px 10px; border-radius:10px;}
  .wb-option{border:1px solid var(--border); border-radius:8px; padding:8px 12px; margin-bottom:8px;}
  .wb-option-head{display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .expl-block{margin-top:12px; padding:10px 12px; background:var(--bg); border-radius:8px; font-size:14px;}
  .expl-missing{margin-top:10px; color:var(--grey); font-style:italic; font-size:13px;}
  .expl-correct{color:var(--green); font-weight:bold; margin-bottom:4px;}
  .expl-correct-mini{color:var(--green); margin-top:6px;}
  .expl-wrong-inline{color:var(--red); margin:2px 0 2px 4px;}
  .expl-ref{color:var(--grey); margin-top:4px;}
  .expl-law{margin-top:6px;}
  .expl-law summary{color:var(--blue); font-weight:bold; cursor:pointer;}
  .expl-law-text{white-space:pre-wrap; margin-top:6px; padding:8px; background:#fff; border:1px solid var(--border); border-radius:6px;}
  .confirm-bar-spacer{display:none;}
  .table-scroll{overflow-x:auto;}

  /* ===== 手機優化（≤480px，桌面版外觀不受影響） ===== */
  @media (max-width:480px){
    #app{padding:10px;}
    .card{padding:14px; border-radius:8px;}
    button, .btn{min-height:44px; padding:10px 14px; font-size:15px;}
    .home-card button, .home-card .btn{width:100%;}
    .mode-btn-group{flex-direction:column;}
    .mode-btn-group button{width:100%; min-height:48px;}
    .scope-options{font-size:15px; gap:10px 16px;}
    .stem{font-size:16px; line-height:1.55;}
    .option-row{padding:13px 14px; font-size:16px; line-height:1.5; margin-bottom:10px; min-height:44px;}
    .q-img{max-width:100%;}
    .exam-sticky-head{position:sticky; top:0; z-index:20; padding-top:6px; padding-bottom:4px; margin:0 -10px; padding-left:10px; padding-right:10px;}
    .confirm-bar{
      position:fixed; left:0; right:0; bottom:0; z-index:30; margin:0;
      background:#fff; border-top:1px solid var(--border);
      padding:10px 14px calc(10px + env(safe-area-inset-bottom));
      box-shadow:0 -2px 10px rgba(0,0,0,.1);
      justify-content:stretch;
    }
    .confirm-bar button{flex:1; min-height:48px; font-size:16px;}
    .confirm-bar > span{flex:0 0 auto; align-self:center; font-size:15px;}
    .confirm-bar-spacer{display:block; height:76px;}
    table{font-size:12px;}
    th,td{padding:6px 4px;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="data/safety-questions.js"></script>
<script src="data/explanations.js"></script>
<script>
/* 本頁與 cm.html 同源複製，修 bug 需同步四份（cm.html／osh.html／safety.html／hygiene.html），
   或改 cm.html 後重跑 tools/gen_job_pages.py 重新生成。 */
/* 解析共用陷阱防護：data/explanations.js 是營造工程管理甲級 b-/c-/s- 的全量解析，
   本職類題庫的 b-/s- id 命名空間與營造甲級重複但代表不同題目，若直接沿用會把
   營造甲級的專業解析錯掛到本職類的專業題上。因此載入後立刻只保留 c- 開頭
   （共同科目 90006–90009，四職類原樣共用同一批題目與解析）之解析；
   本職類 b-/s- 專業題一律走既有「解析生成中」降級樣式，不會顯示錯誤解析。 */
if(window.EXAM_EXPL){
  const _filteredExpl = {};
  Object.keys(window.EXAM_EXPL).forEach(function(k){ if(k.indexOf('c-') === 0) _filteredExpl[k] = window.EXAM_EXPL[k]; });
  window.EXAM_EXPL = _filteredExpl;
}

/* ==================== 常數與 localStorage ==================== */
const KEYS = { ATTEMPTS: 'safetyexam_attempts', WRONGBOOK: 'safetyexam_wrongbook' };

function loadJSON(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function saveJSON(key, val){ localStorage.setItem(key, JSON.stringify(val)); }

function loadAttempts(){ return loadJSON(KEYS.ATTEMPTS, []); }
function saveAttempt(a){ const arr = loadAttempts(); arr.push(a); saveJSON(KEYS.ATTEMPTS, arr); }
function loadWrongbook(){ return loadJSON(KEYS.WRONGBOOK, {}); }
function saveWrongbook(wb){ saveJSON(KEYS.WRONGBOOK, wb); }

/* ==================== 工具函式 ==================== */
function escapeHtml(str){
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function questionImgHtml(q){
  return q.img ? `<img class="q-img" src="${escapeHtml(q.img)}" alt="題目附圖">` : '';
}

/* ==================== 題目解析（EXAM_EXPL，缺項一律優雅降級） ==================== */
function getExpl(qid){
  return (window.EXAM_EXPL && window.EXAM_EXPL[qid]) || null;
}
function getWrongReason(qid, key){
  const e = getExpl(qid);
  return (e && e.w && e.w[key]) ? e.w[key] : '';
}
function explRefHtml(e){
  return e.ref ? `<div class="small expl-ref">依據：${escapeHtml(e.ref)}</div>` : '';
}
function explLawHtml(e){
  return e.law ? `
    <details class="expl-law">
      <summary>📖 法條原文</summary>
      <div class="expl-law-text small">${escapeHtml(e.law)}</div>
    </details>` : '';
}
// 錯題瀏覽卡片用：正解理由＋依據＋法條全文（不含個別選項錯因，錯因是逐選項顯示）。
function renderCorrectReasonBlock(qid){
  const e = getExpl(qid);
  if(!e) return `<div class="expl-missing">📚 解析生成中…</div>`;
  return `
    <div class="expl-block">
      <div class="expl-correct">✓ 正解理由：${escapeHtml(e.c)}</div>
      ${explRefHtml(e)}
      ${explLawHtml(e)}
    </div>`;
}
// 交卷檢討區用：答對只顯示 c（小字）；答錯顯示 c＋你錯選選項的 w＋依據＋法條摺疊。
function renderResultExplBlock(q, given, ok){
  const e = getExpl(q.id);
  if(!e) return `<div class="expl-missing">📚 解析生成中…</div>`;
  if(ok){
    return `<div class="small expl-correct-mini">💡 ${escapeHtml(e.c)}</div>`;
  }
  const wrongHtml = (given || []).filter(k => q.answer.indexOf(k) === -1).map(k => {
    const r = e.w && e.w[k];
    return r ? `<div class="small expl-wrong-inline">✗ ${escapeHtml(k)}．${escapeHtml(r)}</div>` : '';
  }).join('');
  return `
    <div class="expl-block">
      <div class="expl-correct">✓ 正解理由：${escapeHtml(e.c)}</div>
      ${wrongHtml}
      ${explRefHtml(e)}
      ${explLawHtml(e)}
    </div>`;
}
// 錯題瀏覽卡片用：單一選項列（正解綠框／使用者最近錯選紅框／每個非正解選項下方顯示錯因）。
function wrongBrowseOptionRow(q, key, text, lastChosen){
  const isCorrect = q.answer.indexOf(key) !== -1;
  const isChosen = lastChosen.indexOf(key) !== -1;
  let cls = 'wb-option';
  let tag = '';
  if(isCorrect){ cls += ' opt-correct-selected'; tag = ' <span class="tag-ok">✓ 正解</span>'; }
  else if(isChosen){ cls += ' opt-wrong-selected'; tag = ' <span class="tag-ng">✗ 你的答案</span>'; }
  const reason = !isCorrect ? getWrongReason(q.id, key) : '';
  return `
    <div class="${cls}">
      <div class="wb-option-head"><span>${key}. ${escapeHtml(text)}</span>${tag}</div>
      ${reason ? `<div class="small expl-wrong-inline">${escapeHtml(reason)}</div>` : ''}
    </div>`;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function pickQuestions(pool, n){
  return shuffle(pool).slice(0, Math.min(n, pool.length));
}

// 模擬測驗比照正式學科考試：60 題單選 + 20 題複選（單選1分/複選2分，滿分100）。
// 若題庫該類型不足，抽到多少算多少，滿分按實際題數換算。
function pickExamQuestions(scope){
  const all = window.EXAM_DATA.questions;
  const filtered = scope === 'all' ? all : all.filter(q => q.category === scope);
  const singlePool = filtered.filter(q => q.type === 'single');
  const multiPool = filtered.filter(q => q.type === 'multi');
  const singlePicked = pickQuestions(singlePool, 60);
  const multiPicked = pickQuestions(multiPool, 20);
  const questions = shuffle(singlePicked.concat(multiPicked));
  const maxScore = singlePicked.length * 1 + multiPicked.length * 2;
  return { questions, singleCount: singlePicked.length, multiCount: multiPicked.length, maxScore };
}

// 快速測驗：範圍題庫隨機抽 30 題，單複選依題庫自然比例混抽（不特別分層抽樣）、不重複。
function pickQuickQuestions(scope){
  const all = window.EXAM_DATA.questions;
  const filtered = scope === 'all' ? all : all.filter(q => q.category === scope);
  return pickQuestions(filtered, 30);
}

// 馬拉松模式：範圍題庫一次洗牌後依序不重複連續抽題，不限題數。
function pickMarathonPool(scope){
  const all = window.EXAM_DATA.questions;
  const filtered = scope === 'all' ? all : all.filter(q => q.category === scope);
  return shuffle(filtered);
}

function isAnswerCorrect(q, given){
  if(!given || given.length===0) return false;
  const a = q.answer.slice().sort();
  const g = given.slice().sort();
  if(a.length !== g.length) return false;
  return a.every((v,i)=>v===g[i]);
}

function fmtDuration(sec){
  const m = Math.floor(sec/60), s = sec%60;
  return `${m}分${String(s).padStart(2,'0')}秒`;
}
function fmtDate(ts){
  const d = new Date(ts);
  return d.toLocaleString('zh-TW', {hour12:false});
}
function modeLabel(m){
  if(m==='exam') return '模擬測驗';
  if(m==='quick') return '快速測驗';
  if(m==='marathon') return '馬拉松模式';
  return '錯題加強';
}
function scopeLabel(s){
  return {all:'全部', professional:'只專業科目', common:'只共同科目', wrongbook:'錯題本'}[s] || s;
}

/* ==================== 匯出／匯入 ==================== */
function buildExportPayload(){
  return { version:1, exportedAt: Date.now(), attempts: loadAttempts(), wrongbook: loadWrongbook() };
}
function applyImportPayload(payload){
  if(!payload || !Array.isArray(payload.attempts) || typeof payload.wrongbook !== 'object' || payload.wrongbook===null){
    throw new Error('格式錯誤');
  }
  saveJSON(KEYS.ATTEMPTS, payload.attempts);
  saveJSON(KEYS.WRONGBOOK, payload.wrongbook);
}
function exportData(){
  const payload = buildExportPayload();
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'safetyexam_backup_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function handleImportFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const payload = JSON.parse(reader.result);
      applyImportPayload(payload);
      alert('匯入成功');
      render();
    }catch(e){
      alert('匯入失敗：檔案格式錯誤');
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

/* ==================== 應用狀態 ==================== */
let appState = { view: 'home' };

function getScopeValue(){
  const el = document.querySelector('input[name=examScope]:checked');
  return el ? el.value : 'all';
}

function startExam(scope){
  const { questions, singleCount, multiCount, maxScore } = pickExamQuestions(scope);
  if(questions.length === 0){ alert('此範圍沒有題目'); return; }
  appState = {
    view: 'exam', mode: 'exam', scope,
    questions, singleCount, multiCount, maxScore,
    answers: {}, currentIndex: 0, startTime: Date.now(), locked: false
  };
  render();
}

// 快速測驗：隨機30題，流程與計分沿用線性單題模式（沿用 renderExam／answerSingle／toggleMultiAnswer／confirmMulti）。
function startQuick(scope){
  const questions = pickQuickQuestions(scope);
  if(questions.length === 0){ alert('此範圍沒有題目'); return; }
  appState = {
    view: 'exam', mode: 'quick', scope,
    questions, answers: {}, currentIndex: 0, startTime: Date.now(), locked: false
  };
  render();
}

// 馬拉松模式：不重複連續抽題，每題作答後立即顯示對錯與解析，隨時可結束結算。
function startMarathon(scope){
  const pool = pickMarathonPool(scope);
  if(pool.length === 0){ alert('此範圍沒有題目'); return; }
  appState = {
    view: 'marathon', mode: 'marathon', scope,
    pool, poolIndex: 0,
    answeredCount: 0, correctCount: 0, subjectStats: {}, wrongIds: [],
    given: [], feedback: null,
    startTime: Date.now()
  };
  render();
}

function submitMarathonAnswer(given){
  const q = appState.pool[appState.poolIndex];
  const ok = isAnswerCorrect(q, given);
  appState.answeredCount++;
  if(ok) appState.correctCount++; else appState.wrongIds.push(q.id);
  appState.subjectStats[q.subject] = appState.subjectStats[q.subject] || {total:0, correct:0};
  appState.subjectStats[q.subject].total++;
  if(ok) appState.subjectStats[q.subject].correct++;

  const wb = loadWrongbook();
  updateWrongbookForQuestion(wb, q, ok, given, 'marathon');
  saveWrongbook(wb);

  appState.feedback = { ok, given };
  appState.given = given;
  render();
}

function answerMarathonSingle(key){
  if(appState.feedback) return;
  submitMarathonAnswer([key]);
}

function toggleMarathonMulti(key){
  if(appState.feedback) return;
  const cur = appState.given || [];
  appState.given = cur.includes(key) ? cur.filter(k => k !== key) : cur.concat([key]);
  render();
}

function confirmMarathonMulti(){
  if(appState.feedback) return;
  submitMarathonAnswer(appState.given || []);
}

function marathonNext(){
  appState.poolIndex++;
  appState.given = [];
  appState.feedback = null;
  if(appState.poolIndex >= appState.pool.length){
    finishMarathon();
  } else {
    render();
  }
}

// 純函式：由馬拉松即時狀態組出結算 attempt，供 finishMarathon() 與 __selftest() 共用。
function buildMarathonAttempt(m){
  const durationSec = Math.round((Date.now() - m.startTime) / 1000);
  return {
    ts: Date.now(), mode: 'marathon', scope: m.scope,
    total: m.answeredCount, correct: m.correctCount, durationSec,
    wrongIds: m.wrongIds, subjectStats: m.subjectStats,
    score: m.correctCount, maxScore: m.answeredCount,
    passed: m.answeredCount > 0 ? m.correctCount >= m.answeredCount * 0.6 : false
  };
}

function finishMarathon(){
  if(appState.answeredCount === 0 && !confirm('尚未作答任何題目，確定要結束並返回首頁嗎？')) return;
  const attempt = buildMarathonAttempt(appState);
  saveAttempt(attempt);
  appState = { view: 'marathonResult', lastMarathon: attempt };
  render();
}

function startReview(){
  const wb = loadWrongbook();
  const ids = Object.keys(wb);
  const pool = window.EXAM_DATA.questions.filter(q => ids.includes(q.id));
  if(pool.length === 0){ alert('目前沒有錯題，太棒了！'); return; }
  appState = {
    view: 'exam', mode: 'review', scope: 'wrongbook',
    questions: pickQuestions(pool, 50),
    answers: {}, currentIndex: 0, startTime: Date.now(), locked: false
  };
  render();
}

// 單選：點選即鎖定作答，約 300ms 視覺回饋後自動前進下一題（不可回頭修改）。
function answerSingle(qid, key){
  if(appState.locked) return;
  appState.answers[qid] = [key];
  appState.locked = true;
  render();
  setTimeout(() => {
    appState.locked = false;
    advanceOrFinish();
  }, 300);
}

// 複選：可自由勾選，按「確認作答」才前進。
function toggleMultiAnswer(qid, key){
  const cur = appState.answers[qid] || [];
  const next = cur.includes(key) ? cur.filter(k => k !== key) : cur.concat([key]);
  appState.answers[qid] = next;
  render();
}

function confirmMulti(){
  advanceOrFinish();
}

// 線性流程：最後一題作答完畢即自動交卷結算，不可回頭。
function advanceOrFinish(){
  if(appState.currentIndex >= appState.questions.length - 1){
    finishExam();
  } else {
    appState.currentIndex++;
    render();
  }
}

// 純函式：計算作答結果，供 finishExam() 與 __selftest() 共用（不含任何 side effect）。
// mode==='exam'：單選1分/複選2分（全對才給分，不倒扣），score/maxScore 為加權分數。
// mode!=='exam'（錯題加強）：score 直接等於答對題數，maxScore 為總題數（比例與正確率相同）。
function computeResult(questions, answers, mode, examMaxScore){
  let correctCount = 0;
  const wrongIds = [];
  const subjectStats = {};
  const perQuestion = [];
  let score = 0;

  questions.forEach(q => {
    const given = answers[q.id] || [];
    const ok = isAnswerCorrect(q, given);
    subjectStats[q.subject] = subjectStats[q.subject] || {total:0, correct:0};
    subjectStats[q.subject].total++;
    if(ok){
      correctCount++;
      subjectStats[q.subject].correct++;
      if(mode === 'exam') score += (q.type === 'single' ? 1 : 2);
    } else {
      wrongIds.push(q.id);
    }
    perQuestion.push({ id: q.id, ok });
  });

  let maxScore;
  if(mode === 'exam'){
    maxScore = examMaxScore;
  } else {
    score = correctCount;
    maxScore = questions.length;
  }
  const passed = maxScore > 0 ? score >= maxScore * 0.6 : false;

  return { correctCount, wrongIds, subjectStats, score, maxScore, passed, perQuestion };
}

// 純函式：依單題作答結果更新錯題本（in-place 修改並回傳 wb），供 finishExam() 與 __selftest() 共用。
// 答錯：wrongCount+1、streak歸零、lastChosen記錄使用者這次錯選的答案（陣列，向下相容——
// 舊資料沒有此欄位時，讀取端一律以空陣列處理，不影響既有 wrongCount/lastWrong/streak 邏輯）。
// 答對（僅加強模式）：streak+1，達2次自動移出錯題本。
function updateWrongbookForQuestion(wb, q, ok, given, mode){
  if(ok){
    if(mode === 'review' && wb[q.id]){
      wb[q.id].streak = (wb[q.id].streak || 0) + 1;
      if(wb[q.id].streak >= 2) delete wb[q.id];
    }
  } else {
    const existing = wb[q.id] || {wrongCount:0, lastWrong:null, streak:0};
    wb[q.id] = { wrongCount: existing.wrongCount + 1, lastWrong: Date.now(), streak: 0, lastChosen: (given || []).slice() };
  }
  return wb;
}

function finishExam(){
  const durationSec = Math.round((Date.now() - appState.startTime) / 1000);
  const result = computeResult(appState.questions, appState.answers, appState.mode, appState.maxScore);
  const wb = loadWrongbook();

  appState.questions.forEach((q, i) => {
    const ok = result.perQuestion[i].ok;
    const given = appState.answers[q.id] || [];
    updateWrongbookForQuestion(wb, q, ok, given, appState.mode);
  });

  saveWrongbook(wb);
  const attempt = {
    ts: Date.now(), mode: appState.mode, scope: appState.scope,
    total: appState.questions.length, correct: result.correctCount, durationSec,
    wrongIds: result.wrongIds, subjectStats: result.subjectStats,
    score: result.score, maxScore: result.maxScore, passed: result.passed
  };
  saveAttempt(attempt);

  appState = {
    view: 'results',
    lastAttempt: attempt,
    lastQuestions: appState.questions,
    lastAnswers: appState.answers
  };
  render();
}

// 線性流程：一次只顯示一題，答完才顯示下一題，不可回頭修改，不提供題號跳轉。
function renderExam(){
  const { questions, currentIndex, mode, scope, locked } = appState;
  const q = questions[currentIndex];
  const given = appState.answers[q.id] || [];
  const total = questions.length;
  const progressPct = Math.round((currentIndex / total) * 100);

  let compositionNote;
  if(mode === 'exam'){
    compositionNote = `本次共 ${total} 題（單選 ${appState.singleCount}、複選 ${appState.multiCount}），滿分 ${appState.maxScore} 分，60% 及格`;
  } else if(mode === 'quick'){
    compositionNote = `本次共 ${total} 題（快速測驗，隨機抽題不重複），答對題數達 60% 為參考及格線`;
  } else {
    compositionNote = `本次共 ${total} 題（錯題加強）`;
  }

  const optionsHtml = Object.entries(q.options).map(([key, text]) => {
    const isChecked = given.includes(key);
    const inputType = q.type === 'single' ? 'radio' : 'checkbox';
    const name = q.type === 'single' ? `q_${q.id}` : `q_${q.id}_${key}`;
    const disabledAttr = (q.type === 'single' && locked) ? 'disabled' : '';
    const onchange = q.type === 'single'
      ? `onchange="answerSingle('${q.id}','${key}')"`
      : `onchange="toggleMultiAnswer('${q.id}','${key}')"`;
    const rowCls = (q.type === 'single' && isChecked) ? 'option-row selected-flash' : 'option-row';
    return `
      <label class="${rowCls}">
        <input type="${inputType}" name="${name}" ${isChecked ? 'checked' : ''} ${disabledAttr} ${onchange}>
        <span>${key}. ${escapeHtml(text)}</span>
      </label>`;
  }).join('');

  const confirmBtnHtml = q.type === 'multi'
    ? `<div class="confirm-bar"><button onclick="confirmMulti()">確認作答</button></div><div class="confirm-bar-spacer"></div>`
    : '';

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="exam-sticky-head">
      <div class="topbar">
        <div class="topbar-title">${modeLabel(mode)}｜${scopeLabel(scope)}</div>
      </div>
      <div class="progress-bar-track"><div class="progress-bar-fill" style="width:${progressPct}%"></div></div>
      <p class="small" style="text-align:center; margin-top:0;">${compositionNote}</p>
    </div>
    <div class="card">
      <h3>第 ${currentIndex+1} 題 / 共 ${total} 題 ${q.type==='multi' ? '<span class="badge">複選</span>' : ''}</h3>
      <div class="stem">${escapeHtml(q.stem)}</div>
      ${questionImgHtml(q)}
      ${optionsHtml}
      ${confirmBtnHtml}
    </div>
  `;
}

// 馬拉松模式：每題作答後立即顯示對錯與解析；頂部常駐已答題數／答對率；隨時可結束結算。
function renderMarathon(){
  const { pool, poolIndex, answeredCount, correctCount, feedback, given, scope } = appState;
  const q = pool[poolIndex];
  const rate = answeredCount > 0 ? Math.round((correctCount/answeredCount)*1000)/10 : 0;
  const activeGiven = feedback ? (feedback.given || []) : (given || []);

  const optionsHtml = Object.entries(q.options).map(([key, text]) => {
    const isChecked = activeGiven.includes(key);
    const inputType = q.type === 'single' ? 'radio' : 'checkbox';
    const name = q.type === 'single' ? `mq_${q.id}` : `mq_${q.id}_${key}`;
    let cls = 'option-row';
    let disabledAttr = '';
    let onchange = '';
    if(feedback){
      disabledAttr = 'disabled';
      const isCorrectOpt = q.answer.includes(key);
      const isGiven = (feedback.given || []).includes(key);
      if(isCorrectOpt && isGiven) cls += ' opt-correct-selected';
      else if(isCorrectOpt && !isGiven) cls += ' opt-correct-missed';
      else if(!isCorrectOpt && isGiven) cls += ' opt-wrong-selected';
    } else {
      onchange = q.type === 'single'
        ? `onchange="answerMarathonSingle('${key}')"`
        : `onchange="toggleMarathonMulti('${key}')"`;
    }
    return `
      <label class="${cls}">
        <input type="${inputType}" name="${name}" ${isChecked ? 'checked' : ''} ${disabledAttr} ${onchange}>
        <span>${key}. ${escapeHtml(text)}</span>
      </label>`;
  }).join('');

  const confirmBtnHtml = (!feedback && q.type === 'multi')
    ? `<div class="confirm-bar"><button onclick="confirmMarathonMulti()">確認作答</button></div><div class="confirm-bar-spacer"></div>`
    : '';

  const feedbackHtml = feedback ? `
    <div class="marathon-feedback">
      <div class="small">正確答案：${q.answer.join('、')}　你的答案：${(feedback.given||[]).length ? feedback.given.join('、') : '（未作答）'}</div>
      ${renderResultExplBlock(q, feedback.given, feedback.ok)}
    </div>
    <div class="confirm-bar">
      <span class="${feedback.ok ? 'tag-ok' : 'tag-ng'}">${feedback.ok ? '✓ 答對了' : '✗ 答錯了'}</span>
      <button onclick="marathonNext()">下一題</button>
    </div>
    <div class="confirm-bar-spacer"></div>` : '';

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="exam-sticky-head">
      <div class="topbar">
        <div class="topbar-title">馬拉松模式｜${scopeLabel(scope)}</div>
        <div class="progress">已答 ${answeredCount} 題｜答對率 ${rate}%</div>
        <div class="topbar-actions"><button class="grey" onclick="finishMarathon()">結束</button></div>
      </div>
    </div>
    <div class="card">
      <h3>第 ${poolIndex+1} 題（本輪範圍共 ${pool.length} 題）${q.type==='multi' ? '<span class="badge">複選</span>' : ''}</h3>
      <div class="stem">${escapeHtml(q.stem)}</div>
      ${questionImgHtml(q)}
      ${optionsHtml}
      ${confirmBtnHtml}
      ${feedbackHtml}
    </div>
  `;
}

// 錯題瀏覽頁：列出錯題本全部題目，預設依錯誤次數降冪、其次最近錯誤時間降冪排序。
function renderWrongBrowse(){
  const wb = loadWrongbook();
  const ids = Object.keys(wb);
  const app = document.getElementById('app');

  const items = ids.map(id => {
    const q = window.EXAM_DATA.questions.find(qq => qq.id === id);
    return q ? { q, entry: wb[id] } : null;
  }).filter(Boolean);

  if(items.length === 0){
    app.innerHTML = `${topbar('錯題瀏覽')}<div class="card"><div class="empty-msg">目前沒有錯題，太棒了！</div></div>`;
    return;
  }

  items.sort((a, b) => {
    const cA = a.entry.wrongCount || 0, cB = b.entry.wrongCount || 0;
    if(cB !== cA) return cB - cA;
    return (b.entry.lastWrong || 0) - (a.entry.lastWrong || 0);
  });

  const cardsHtml = items.map(({q, entry}) => {
    const lastChosen = entry.lastChosen || []; // 舊紀錄無此欄位時視為空陣列，只標正解不標錯選
    const optsHtml = Object.entries(q.options)
      .map(([key, text]) => wrongBrowseOptionRow(q, key, text, lastChosen))
      .join('');
    return `
      <div class="card wb-card">
        <div class="wb-corner">錯 ${entry.wrongCount || 0} 次｜連對 ${entry.streak || 0}/2</div>
        <div class="stem">${escapeHtml(q.stem)}</div>
        ${questionImgHtml(q)}
        ${optsHtml}
        ${renderCorrectReasonBlock(q.id)}
      </div>`;
  }).join('');

  app.innerHTML = `
    ${topbar('錯題瀏覽')}
    <p class="small" style="text-align:center;">依錯誤次數、最近錯誤時間排序，共 ${items.length} 題</p>
    ${cardsHtml}
  `;
}

function renderHistory(){
  const attempts = loadAttempts().slice().sort((a,b) => b.ts - a.ts);
  const app = document.getElementById('app');

  let bodyHtml;
  if(attempts.length === 0){
    bodyHtml = `<div class="empty-msg">尚無測驗紀錄</div>`;
  } else {
    const rows = attempts.map(a => {
      const scoreCell = a.mode === 'exam'
        ? `${a.score} / ${a.maxScore} 分${a.passed ? '（及格）' : '（不及格）'}`
        : `${a.correct} / ${a.total}`;
      return `
      <tr>
        <td>${fmtDate(a.ts)}</td>
        <td>${modeLabel(a.mode)}</td>
        <td>${scopeLabel(a.scope)}</td>
        <td>${scoreCell}</td>
        <td>${Math.round((a.correct/a.total)*1000)/10}%</td>
        <td>${fmtDuration(a.durationSec)}</td>
      </tr>`;
    }).join('');
    bodyHtml = `
      <div class="table-scroll">
        <table>
          <thead><tr><th>日期</th><th>模式</th><th>範圍</th><th>分數</th><th>正確率</th><th>用時</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  // 趨勢：最近 10 次（按時間排序，舊到新）
  const chronological = attempts.slice().sort((a,b) => a.ts - b.ts);
  const last10 = chronological.slice(-10);
  let svgHtml = `<div class="empty-msg">尚無足夠資料繪製趨勢圖</div>`;
  if(last10.length > 0){
    const w = 640, h = 160, pad = 24;
    const stepX = last10.length > 1 ? (w - pad*2) / (last10.length - 1) : 0;
    const points = last10.map((a, i) => {
      const pct = (a.maxScore ? (a.score / a.maxScore) : (a.correct / a.total)) * 100;
      const x = pad + i * stepX;
      const y = h - pad - (pct/100)*(h - pad*2);
      return {x, y, pct};
    });
    const polyline = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const dots = points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#1565c0"></circle>
      <text x="${p.x.toFixed(1)}" y="${(p.y-8).toFixed(1)}" font-size="11" text-anchor="middle">${Math.round(p.pct)}</text>`).join('');
    svgHtml = `
      <svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;">
        <line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="#ccc"></line>
        <polyline points="${polyline}" fill="none" stroke="#1565c0" stroke-width="2"></polyline>
        ${dots}
      </svg>`;
  }

  app.innerHTML = `
    ${topbar('成績紀錄')}
    <div class="card">
      <h3>最近 10 次分數趨勢</h3>
      ${svgHtml}
    </div>
    <div class="card">${bodyHtml}</div>
  `;
}

function renderStats(){
  const attempts = loadAttempts();
  const agg = {};
  attempts.forEach(a => {
    const stats = a.subjectStats || {};
    Object.entries(stats).forEach(([subj, s]) => {
      agg[subj] = agg[subj] || {total:0, correct:0};
      agg[subj].total += s.total;
      agg[subj].correct += s.correct;
    });
  });
  const rows = Object.entries(agg).map(([subj, s]) => ({
    subj, total: s.total, correct: s.correct, rate: s.total ? (s.correct/s.total*100) : 0
  })).sort((a,b) => a.rate - b.rate);

  const app = document.getElementById('app');
  if(rows.length === 0){
    app.innerHTML = `${topbar('統計')}<div class="card"><div class="empty-msg">尚無資料，先完成一次測驗吧</div></div>`;
    return;
  }
  const barsHtml = rows.map(r => `
    <div class="bar-row">
      <div class="bar-label">${escapeHtml(r.subj)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${r.rate.toFixed(1)}%"></div></div>
      <div style="width:90px;">${r.correct}/${r.total}（${r.rate.toFixed(1)}%）</div>
    </div>
  `).join('');

  app.innerHTML = `
    ${topbar('統計')}
    <div class="card">
      <h3>科目答對率（弱點科目由上而下排序）</h3>
      ${barsHtml}
    </div>
  `;
}

function render(){
  switch(appState.view){
    case 'exam': renderExam(); break;
    case 'marathon': renderMarathon(); break;
    case 'marathonResult': renderMarathonResult(); break;
    case 'results': renderResults(); break;
    case 'history': renderHistory(); break;
    case 'stats': renderStats(); break;
    case 'wrongbrowse': renderWrongBrowse(); break;
    default: renderHome();
  }
}

render();

/* ==================== 內建自我測試 window.__selftest() ==================== */
window.__selftest = function(){
  const results = [];
  function check(name, cond){ results.push({ name, pass: !!cond }); }

  // 1. 隨機抽題不重複
  (function(){
    const pool = window.EXAM_DATA.questions;
    const picked = pickQuestions(pool, 8);
    const ids = picked.map(q => q.id);
    check('隨機抽題不重複', new Set(ids).size === ids.length && ids.length === Math.min(8, pool.length));
  })();

  // 2. 範圍過濾正確
  (function(){
    const prof = window.EXAM_DATA.questions.filter(q => q.category === 'professional');
    const common = window.EXAM_DATA.questions.filter(q => q.category === 'common');
    check('範圍過濾-專業科目', prof.length > 0 && prof.every(q => q.category === 'professional'));
    check('範圍過濾-共同科目', common.length > 0 && common.every(q => q.category === 'common'));
  })();

  // 3. 複選題判分：全對才算對
  (function(){
    const q = { answer: ['1','3'] };
    check('複選-順序不同但集合相同視為正確', isAnswerCorrect(q, ['3','1']) === true);
    check('複選-少選視為錯誤', isAnswerCorrect(q, ['1']) === false);
    check('複選-多選視為錯誤', isAnswerCorrect(q, ['1','2','3']) === false);
    check('複選-選錯視為錯誤', isAnswerCorrect(q, ['2','4']) === false);
    check('單選-正確', isAnswerCorrect({answer:['2']}, ['2']) === true);
    check('未作答視為錯誤', isAnswerCorrect({answer:['2']}, []) === false);
  })();

  // 4. 錯題本進出邏輯（使用暫存，測完還原原本資料）
  (function(){
    const backupWb = localStorage.getItem(KEYS.WRONGBOOK);
    try{
      saveWrongbook({});
      let wb = loadWrongbook();
      wb['TEST-Q1'] = { wrongCount: 1, lastWrong: Date.now(), streak: 0 };
      saveWrongbook(wb);
      check('答錯後加入錯題本', !!loadWrongbook()['TEST-Q1']);

      // 模擬加強模式連對兩次
      wb = loadWrongbook();
      wb['TEST-Q1'].streak = 1; // 第一次答對
      saveWrongbook(wb);
      wb = loadWrongbook();
      wb['TEST-Q1'].streak += 1; // 第二次答對
      if(wb['TEST-Q1'].streak >= 2) delete wb['TEST-Q1'];
      saveWrongbook(wb);
      check('連續答對2次自動移出錯題本', !loadWrongbook()['TEST-Q1']);
    } finally {
      if(backupWb === null) localStorage.removeItem(KEYS.WRONGBOOK);
      else localStorage.setItem(KEYS.WRONGBOOK, backupWb);
    }
  })();

  // 5. 匯出／匯入 round-trip（使用暫存，測完還原原本資料）
  (function(){
    const backupAttempts = localStorage.getItem(KEYS.ATTEMPTS);
    const backupWb = localStorage.getItem(KEYS.WRONGBOOK);
    try{
      saveJSON(KEYS.ATTEMPTS, [{ts:1, mode:'exam', scope:'all', total:50, correct:40, durationSec:600, wrongIds:['a'], subjectStats:{}}]);
      saveJSON(KEYS.WRONGBOOK, {'a': {wrongCount:1, lastWrong:1, streak:0}});
      const exported = buildExportPayload();
      saveJSON(KEYS.ATTEMPTS, []);
      saveJSON(KEYS.WRONGBOOK, {});
      applyImportPayload(exported);
      const attemptsBack = loadAttempts();
      const wbBack = loadWrongbook();
      check('匯出匯入-attempts還原', attemptsBack.length === 1 && attemptsBack[0].correct === 40);
      check('匯出匯入-wrongbook還原', !!wbBack['a'] && wbBack['a'].wrongCount === 1);
    } finally {
      if(backupAttempts === null) localStorage.removeItem(KEYS.ATTEMPTS);
      else localStorage.setItem(KEYS.ATTEMPTS, backupAttempts);
      if(backupWb === null) localStorage.removeItem(KEYS.WRONGBOOK);
      else localStorage.setItem(KEYS.WRONGBOOK, backupWb);
    }
  })();

  // 6. 模擬測驗抽題比例：60單選+20複選（題庫不足則抽到多少算多少，滿分同步換算）
  (function(){
    const picked = pickExamQuestions('all');
    const totalSingle = window.EXAM_DATA.questions.filter(q => q.type === 'single').length;
    const totalMulti = window.EXAM_DATA.questions.filter(q => q.type === 'multi').length;
    check('模擬測驗-單選題數符合上限或題庫上限', picked.singleCount === Math.min(60, totalSingle));
    check('模擬測驗-複選題數符合上限或題庫上限', picked.multiCount === Math.min(20, totalMulti));
    check('模擬測驗-滿分按實際抽題數計算', picked.maxScore === picked.singleCount * 1 + picked.multiCount * 2);
    check('模擬測驗-抽出題目不重複', new Set(picked.questions.map(q => q.id)).size === picked.questions.length);
  })();

  // 7. 加權計分與60%及格判定（單選1分/複選2分，全對才給分，答錯不倒扣）
  (function(){
    const testQuestions = [
      { id:'t1', type:'single', subject:'S', answer:['1'] },
      { id:'t2', type:'single', subject:'S', answer:['2'] },
      { id:'t3', type:'multi', subject:'S', answer:['1','2'] },
      { id:'t4', type:'multi', subject:'S', answer:['1','2'] }
    ];
    // 全對：1+1+2+2=6 分，滿分6分 → 及格
    let r = computeResult(testQuestions, {t1:['1'], t2:['2'], t3:['1','2'], t4:['1','2']}, 'exam', 6);
    check('加權計分-全對得滿分且及格', r.score === 6 && r.passed === true);

    // t2單選答錯(0分)、t4複選少選(0分，不倒扣)：1+0+2+0=3分，3 < 6*0.6=3.6 → 不及格
    r = computeResult(testQuestions, {t1:['1'], t2:['1'], t3:['1','2'], t4:['1']}, 'exam', 6);
    check('加權計分-單選答錯與複選少選皆算0分不倒扣', r.score === 3);
    check('60%及格線-未達門檻判定不及格', r.passed === false);

    // 僅t2單選答錯，其餘全對：1+0+2+2=5分，5 >= 3.6 → 及格
    r = computeResult(testQuestions, {t1:['1'], t2:['1'], t3:['1','2'], t4:['1','2']}, 'exam', 6);
    check('60%及格線-達門檻判定及格', r.score === 5 && r.passed === true);
  })();

  // 8. 錯題加強模式計分不套用加權（score=答對題數，maxScore=總題數）
  (function(){
    const testQuestions = [
      { id:'r1', type:'single', subject:'S', answer:['1'] },
      { id:'r2', type:'multi', subject:'S', answer:['1','2'] }
    ];
    const r = computeResult(testQuestions, {r1:['1'], r2:['1']}, 'review', 999);
    check('錯題加強-計分不套用單選複選加權', r.score === 1 && r.maxScore === 2);
  })();

  // 9. lastChosen 記錄：答錯時把使用者錯選的答案存入錯題本（純函式 updateWrongbookForQuestion）
  (function(){
    const wb = {};
    updateWrongbookForQuestion(wb, {id:'TEST-LC'}, false, ['2','4'], 'exam');
    check('lastChosen記錄使用者錯選答案(單選/複選皆為陣列)',
      Array.isArray(wb['TEST-LC'].lastChosen) && wb['TEST-LC'].lastChosen.join(',') === '2,4');
    // 答對時（加強模式）不應寫入/更動 lastChosen
    updateWrongbookForQuestion(wb, {id:'TEST-LC2'}, true, ['1'], 'review');
    check('答對時不建立錯題本項目', wb['TEST-LC2'] === undefined);
  })();

  // 10. 錯題瀏覽渲染：已知題目正常顯示正解理由，未知題目優雅降級為「解析生成中」不報錯
  (function(){
    const knownIds = Object.keys(window.EXAM_EXPL || {});
    let threw = false, htmlKnown = '', htmlMissing = '', rowHtml = '';
    try{
      if(knownIds.length){
        htmlKnown = renderCorrectReasonBlock(knownIds[0]);
      }
      htmlMissing = renderCorrectReasonBlock('NON-EXISTENT-ID-不存在');
      const fakeQ = { id:'NON-EXISTENT-ID-不存在', answer:['1'] };
      rowHtml = wrongBrowseOptionRow(fakeQ, '2', '測試選項', []);
    }catch(e){ threw = true; }
    check('錯題瀏覽-已知題目渲染含正解理由', knownIds.length === 0 || /正解理由/.test(htmlKnown));
    check('錯題瀏覽-未知題目優雅降級顯示「解析生成中」', !threw && /解析生成中/.test(htmlMissing));
    check('錯題瀏覽-選項列缺解析仍正常渲染不報錯', !threw && typeof rowHtml === 'string' && rowHtml.length > 0);
  })();

  // 11. EXAM_EXPL 整檔缺失（比照真實情境：管線尚未產出/檔案載入失敗）時，各解析函式仍不報錯
  (function(){
    const backup = window.EXAM_EXPL;
    let threw = false;
    try{
      window.EXAM_EXPL = undefined;
      renderCorrectReasonBlock('b-01-001');
      renderResultExplBlock({id:'b-01-001', answer:['1']}, ['2'], false);
      getWrongReason('b-01-001', '1');
    }catch(e){ threw = true; }
    finally{ window.EXAM_EXPL = backup; }
    check('EXAM_EXPL整檔缺失時解析函式不報錯(優雅降級)', threw === false);
  })();

  // 12. 快速測驗：抽 30 題不重複（或題庫上限），單複選混抽自然比例（不分層）
  (function(){
    const picked = pickQuickQuestions('all');
    const ids = picked.map(q => q.id);
    check('快速測驗-抽30題不重複(或題庫上限)',
      new Set(ids).size === ids.length && ids.length === Math.min(30, window.EXAM_DATA.questions.length));
  })();

  // 13. 快速測驗計分：不套用單複選加權（比照錯題加強，score=答對題數）
  (function(){
    const testQuestions = [
      { id:'qq1', type:'single', subject:'S', answer:['1'] },
      { id:'qq2', type:'multi', subject:'S', answer:['1','2'] },
      { id:'qq3', type:'single', subject:'S', answer:['2'] }
    ];
    const r = computeResult(testQuestions, {qq1:['1'], qq2:['1'], qq3:['2']}, 'quick', 999);
    check('快速測驗-計分為答對題數不加權', r.score === 2 && r.maxScore === 3 && r.correctCount === 2);
    check('快速測驗-60%參考線及格判定', r.passed === (2 >= 3 * 0.6));
  })();

  // 14. 馬拉松模式：抽題池不重複（範圍題庫一次洗牌，依序抽題不放回，池大小=範圍題庫全數）
  (function(){
    const pool = pickMarathonPool('professional');
    const ids = pool.map(q => q.id);
    const totalProf = window.EXAM_DATA.questions.filter(q => q.category === 'professional').length;
    check('馬拉松-抽題池不重複且涵蓋範圍全數題目', new Set(ids).size === ids.length && ids.length === totalProf);
  })();

  // 15. 馬拉松模式：結算紀錄 mode='marathon' 且統計正確（純函式 buildMarathonAttempt，不觸發 render）
  (function(){
    const fakeState = {
      scope: 'all', startTime: Date.now() - 5000,
      answeredCount: 7, correctCount: 5,
      wrongIds: ['a','b'], subjectStats: { 'S': {total:7, correct:5} }
    };
    const attempt = buildMarathonAttempt(fakeState);
    check('馬拉松-結算紀錄mode正確', attempt.mode === 'marathon');
    check('馬拉松-結算統計正確(total/correct/passed)',
      attempt.total === 7 && attempt.correct === 5 && attempt.passed === (5 >= 7 * 0.6));
  })();

  console.table(results);
  const failed = results.filter(r => !r.pass);
  console.log(failed.length === 0 ? '全部通過 (pass)' : `${failed.length} 項失敗 (fail)`);
  return results;
};
