<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>技術士考古題題庫</title>
<style>
  :root{
    --blue:#1565c0; --blue-d:#0d47a1; --grey:#757575; --bg:#f4f5f7; --card:#ffffff;
    --border:#e0e0e0; --text:#222; --orange:#ef6c00;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:"Microsoft JhengHei","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
  }
  #app{max-width:960px; margin:0 auto; padding:16px;}
  .site-header{text-align:center; padding:24px 16px 8px;}
  .site-header h1{margin:0 0 6px; font-size:26px; color:var(--blue-d);}
  .site-header p{margin:0; color:var(--grey); font-size:14px;}
  .grid-jobs{display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-top:20px;}
  @media (max-width:600px){ .grid-jobs{grid-template-columns:1fr;} }
  .job-card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.06); display:flex; flex-direction:column;
  }
  .job-card h2{margin:0 0 4px; font-size:19px; color:var(--blue-d);}
  .job-card .job-alt{color:var(--grey); font-size:13px; margin-bottom:10px;}
  .job-card .job-count{
    display:inline-block; align-self:flex-start; background:var(--orange); color:#fff;
    font-size:12px; padding:2px 10px; border-radius:10px; margin-bottom:12px;
  }
  .job-card .btn{
    display:inline-block; text-align:center; cursor:pointer; border:none; border-radius:6px;
    padding:10px 14px; font-size:15px; background:var(--blue); color:#fff; text-decoration:none;
    transition:opacity .15s; margin-bottom:10px;
  }
  .job-card .btn:hover{opacity:.85;}
  .job-card .sub-links{display:flex; gap:8px; flex-wrap:wrap; margin-top:auto;}
  .job-card .sub-links a{
    font-size:13px; color:var(--blue); text-decoration:none; border:1px solid var(--blue);
    border-radius:14px; padding:4px 12px;
  }
  .job-card .sub-links a:hover{background:#eef3fa;}
  .site-footer{text-align:center; color:var(--grey); font-size:12px; padding:24px 16px;}
  @media (max-width:480px){
    #app{padding:10px;}
    .job-card .btn{padding:12px 14px; font-size:16px; min-height:44px;}
    .job-card .sub-links a{padding:8px 14px; font-size:14px;}
  }
</style>
</head>
<body>
<div id="app">
  <div class="site-header">
    <h1>技術士考古題題庫</h1>
    <p>四職類學科線上測驗＋術科歷屆試題，純前端、離線可用，資料存於本機瀏覽器。</p>
  </div>

  <div class="grid-jobs">
    <div class="job-card">
      <h2>營造工程管理 甲級</h2>
      <div class="job-alt">工地負責人</div>
      <div class="job-count">題庫 1,519 題</div>
      <a class="btn" href="cm.html">前往學科測驗</a>
      <div class="sub-links">
        <a href="practical.html">術科詳解</a>
        <a href="study.html">備考重點</a>
      </div>
    </div>

    <div class="job-card">
      <h2>職業安全衛生管理 乙級</h2>
      <div class="job-alt">職業安全衛生管理員</div>
      <div class="job-count">題庫 1,602 題</div>
      <a class="btn" href="osh.html">前往學科測驗</a>
      <div class="sub-links">
        <a href="osh-practical.html">術科試題與詳解</a>
      </div>
    </div>

    <div class="job-card">
      <h2>職業安全管理 甲級</h2>
      <div class="job-alt">職業安全管理師</div>
      <div class="job-count">題庫 1,455 題</div>
      <a class="btn" href="safety.html">前往學科測驗</a>
      <div class="sub-links">
        <a href="safety-practical.html">術科試題與詳解</a>
      </div>
    </div>

    <div class="job-card">
      <h2>職業衛生管理 甲級</h2>
      <div class="job-alt">職業衛生管理師</div>
      <div class="job-count">題庫 1,866 題</div>
      <a class="btn" href="hygiene.html">前往學科測驗</a>
      <div class="sub-links">
        <a href="hygiene-practical.html">術科試題與詳解</a>
      </div>
    </div>
  </div>

  <div class="site-footer">
    各職類作答紀錄與錯題本各自獨立存放於瀏覽器 localStorage，互不影響。
  </div>
</div>
</body>
</html>
